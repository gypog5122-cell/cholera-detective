<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콜레라 탐정 — 1854 소호 사건 파일</title>
<style>
:root{
  --paper:#f4efe3; --card:#fffdf7; --ink:#1d1a16; --ink2:#4d4842; --muted:#8b8378;
  --rule:#e2d9c6; --line:#cfc5b2; --red:#b3261e; --gold:#b8860b; --yellow:#ffe24a;
  --blue:#2a5d8f; --green:#2f7d4f; --street:#7a7166;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:15.5px;line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(120,100,60,.06) 1px,transparent 1px);background-size:6px 6px}
.page{max-width:1320px;margin:0 auto;padding:22px 20px 60px}

/* HUD */
.hud{display:flex;align-items:center;gap:18px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 18px;margin-bottom:14px;flex-wrap:wrap}
.hud .logo{font-weight:800;letter-spacing:-.02em;font-size:18px}
.hud .logo span{color:#ffcf4a}
.stages{display:flex;gap:6px;flex:1;min-width:280px}
.stages div{flex:1;font-size:12px;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.08);color:#bdb4a6;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stages div.on{background:#ffcf4a;color:var(--ink);font-weight:800}
.stages div.done{background:rgba(255,207,74,.25);color:#fff}
.stages div{cursor:pointer;transition:box-shadow .12s}
.stages div:not(.lock):hover{box-shadow:inset 0 0 0 1.5px #ffcf4a}
.stages div.lock{cursor:default;opacity:.5}
.score{font-size:13px;color:#bdb4a6;text-align:right}
.score b{display:block;font-size:24px;color:#fff;line-height:1.1;font-variant-numeric:tabular-nums}
.score.bump b{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.35);color:#ffcf4a}}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.mapcard{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:8px;position:relative;box-shadow:0 2px 0 var(--rule)}
#map{width:100%;height:auto;display:block;border-radius:6px;touch-action:none;user-select:none}
#map.aim{cursor:crosshair}
.mapcard .zoomtools{position:absolute;right:18px;top:18px;display:flex;flex-direction:column;gap:4px;z-index:3}
.mapcard .zoomtools button{width:32px;height:32px;border:1px solid var(--line);background:rgba(255,255,255,.95);
  border-radius:6px;font-size:17px;cursor:pointer;color:var(--ink);line-height:1;padding:0}
.mapcard .zoomtools button:hover{border-color:var(--ink)}
.maphint{position:absolute;right:18px;bottom:14px;font-size:11.5px;color:var(--muted);
  background:rgba(255,255,255,.85);border-radius:5px;padding:2px 7px;pointer-events:none;z-index:3}
#map{cursor:grab}
#map.drag{cursor:grabbing}
.banner{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(29,26,22,.92);color:#fff;
  padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .3s}
.banner.hide{opacity:0}
.datebox{position:absolute;left:18px;bottom:18px;background:rgba(255,253,247,.95);border:1px solid var(--line);border-radius:10px;padding:8px 12px;pointer-events:none}
.datebox .d{font-size:13px;color:var(--ink2)}
.datebox .n{font-size:28px;font-weight:800;color:var(--red);line-height:1.1;font-variant-numeric:tabular-nums}
.datebox .n small{font-size:14px}
.spark{display:block;margin-top:4px}

/* notebook */
.note{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 16px;position:sticky;top:14px;
  box-shadow:0 2px 0 var(--rule);min-height:420px}
.note .tag{display:inline-block;font-size:11px;letter-spacing:.14em;font-weight:800;color:#fff;background:var(--red);padding:2px 8px;border-radius:4px}
.note h2{font-size:22px;letter-spacing:-.02em;line-height:1.3;margin:8px 0 10px}
.note p{margin-bottom:10px;font-size:14.8px}
.note .q{border-left:3px solid var(--line);padding:2px 0 2px 12px;color:var(--ink2);font-size:14px;margin:10px 0}
.note .case{background:#f7f1e3;border-radius:10px;padding:12px 14px;margin:8px 0 12px;font-size:14.3px}
.note .case b{color:var(--red)}
.note table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0 10px}
.note th,.note td{border-bottom:1px solid var(--rule);padding:6px 7px;text-align:left;vertical-align:top}
.note th{color:var(--muted);font-weight:600;font-size:11.5px}
.note tr.me td{background:#fff7e6}
.note .chain{list-style:none;margin:10px 0;padding:0;counter-reset:ch}
.note .chain li{counter-increment:ch;position:relative;padding:8px 0 8px 32px;border-top:1px solid var(--rule);font-size:13.6px;line-height:1.55}
.note .chain li:last-child{border-bottom:1px solid var(--rule)}
.note .chain li::before{content:counter(ch);position:absolute;left:0;top:8px;width:21px;height:21px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.note .chain li.fin{background:#fff7e6}
.note .chain li.fin::before{background:var(--red)}
.note .after{list-style:none;margin:10px 0;padding:0}
.note .after li{padding:8px 0;border-top:1px solid var(--rule);font-size:13.6px;line-height:1.55}
.note .after li:last-child{border-bottom:1px solid var(--rule)}
.note u{text-underline-offset:3px}
.btn{font:inherit;font-weight:800;font-size:15px;border:none;border-radius:10px;padding:11px 16px;cursor:pointer;
  background:var(--ink);color:#fff;width:100%;margin-top:6px;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:600;font-size:13.5px;padding:7px 12px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.choices button{font:inherit;text-align:left;font-size:14.5px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  padding:10px 13px;cursor:pointer;color:var(--ink);transition:border-color .15s,background .15s}
.choices button:hover:not(:disabled){border-color:var(--ink)}
.choices button.right{border-color:var(--green);background:#e9f5ee}
.choices button.wrong{border-color:var(--red);background:#fbeceb;animation:shake .35s}
.choices button:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin-top:10px;font-size:14px;border-radius:10px;padding:10px 12px}
.fb.ok{background:#e9f5ee;color:#1e5235}
.fb.no{background:#fbeceb;color:#7a1a14}
.pts{font-weight:800;color:var(--gold)}
.checks{display:flex;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.checks span{font-size:13px;border:1.5px dashed var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.checks span.got{border-style:solid;border-color:var(--green);color:var(--green);font-weight:700}
.checks span[data-s]{cursor:pointer;transition:border-color .12s,color .12s}
.checks span[data-s]:hover{border-color:var(--ink);color:var(--ink)}

/* map styles */
.street{fill:none;stroke:var(--street);stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke}
.frame{fill:none;stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
.slabel{fill:#3a352f;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.slabel.sq{font-weight:800;fill:var(--ink)}
.death{stroke:var(--ink);stroke-linecap:butt;opacity:0}
.death.on{opacity:1;animation:pop .45s ease-out}
.death.new{stroke:var(--red)}
@keyframes pop{0%{opacity:0}40%{opacity:1;stroke:var(--red)}100%{opacity:1}}
.death.noanim{animation:none}
.pump .p{fill:var(--ink);stroke:#fff;stroke-width:1.4;vector-effect:non-scaling-stroke;transition:fill .2s}
.pump text{fill:var(--ink);font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.pump .hit{fill:transparent}
.pump .halo{fill:rgba(255,207,74,.0);stroke:none;transition:fill .2s}
.pickable .pump{cursor:pointer}
.pickable .pump:hover .halo{fill:rgba(255,207,74,.55)}
.pump.bad .p{fill:#9a9184}
.pump.bad text{fill:#9a9184;text-decoration:line-through}
.pump.culprit .p{fill:var(--red)}
.pump.culprit text{fill:var(--red)}
.pulse{fill:none;stroke:var(--red);stroke-width:2.2;opacity:0;vector-effect:non-scaling-stroke;display:none}
.pulse.go{display:inline;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{r:6;opacity:.9}100%{r:44;opacity:0}}
.yel{fill:var(--yellow);stroke:#c9a800;stroke-width:2;vector-effect:non-scaling-stroke;opacity:0;transition:opacity .5s}
.yel.found{opacity:.95}
.yel-l{font-weight:800;fill:var(--ink);pointer-events:none;opacity:0;transition:opacity .5s}
.yel-l.found{opacity:1}
.miss{fill:none;stroke:var(--red);stroke-width:2;vector-effect:non-scaling-stroke;animation:miss .7s forwards}
@keyframes miss{0%{opacity:1}100%{opacity:0}}
.xmark{fill:var(--red);font-weight:800;animation:miss .9s forwards;pointer-events:none}
.hintc{fill:rgba(255,207,74,.15);stroke:var(--gold);stroke-width:2;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.casepin{cursor:pointer}
.casepin circle{fill:var(--blue);stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.casepin text{fill:#fff;font-weight:800;pointer-events:none}
.casepin.done circle{fill:var(--green)}
.casepin:hover circle{fill:#1b4370}
.caseline{stroke:var(--blue);stroke-width:2;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;fill:none}
.ring{fill:none;stroke:var(--red);stroke-dasharray:4 4;stroke-width:1.3;opacity:.8;vector-effect:non-scaling-stroke}
.hide{display:none}

/* timeline stage */
.tl{position:absolute;inset:8px;background:rgba(255,253,247,.97);border-radius:6px;display:flex;flex-direction:column;justify-content:center;padding:30px}
.tl h3{font-size:20px;font-weight:800;margin-bottom:2px}
.tl .sub{color:var(--ink2);font-size:14px;margin-bottom:10px}
.tl svg{width:100%;height:auto}
.tl.hide{display:none}
.tbar{fill:#a59d90}
.tbar.peak{fill:var(--red)}
.tbar.future{fill:#e8e1d2}

/* ending */
.end{text-align:center}
.medal{width:120px;height:120px;margin:4px auto 8px;display:block}
.rank{font-size:26px;font-weight:800;letter-spacing:-.02em}
.bigscore{font-size:46px;font-weight:800;color:var(--gold);line-height:1.1}
.lesson{text-align:left;background:#f7f1e3;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px}
.lesson li{margin:0 0 4px 18px}

#toast{position:fixed;left:50%;top:80px;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:#fff;
  font-weight:800;font-size:20px;padding:8px 18px;border-radius:999px;opacity:0;transition:all .3s;pointer-events:none;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;width:8px;height:12px;top:-20px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{margin-top:20px;font-size:12px;color:var(--muted)}

@media (max-width:980px){
  .stage{grid-template-columns:1fr}
  .note{position:static;min-height:0}
  .stages div{font-size:11px}
}
</style>
</head>

function quiz(container, opts, correctIdx, pts, onDone, explain, nextLabel){

    <p>9월 8일 손잡이가 제거됐다. 흔히 <b>"그래서 유행이 끝났다"</b>로 이야기가 끝난다.</p>
    <p>그래프를 잘 보고 예측해 보세요. <b>사망자가 가장 많았던 날은?</b></p><div id="qz"></div>`);
  quiz($("qz"), ["8월 31일","9월 2일","9월 7일"], 1, 100, step6b, "정점은 <b>9월 2일, 127명</b>. 9월 7일엔 이미 32명으로 줄어 있었다.");
}
function step6b(){
  drawTimeline(true);
  $("tl").querySelector("h3").textContent = "일별 콜레라 사망자 — 전체 기록 (8/19 ~ 9/30)";
  $("tl").querySelector(".sub").textContent = "점선이 손잡이를 뗀 9월 8일. 그 전에 이미 크게 꺾여 있었다.";
  note(`<span class="tag">STAGE 6</span><h2>최종 판단</h2>
    <p>손잡이 제거 후 사망자는 계속 줄었다. 하지만 <b>그 전부터 이미 줄고 있었다.</b>
      많은 주민이 동네를 떠났고, 걸릴 사람도 남아 있지 않았다.</p>
    <p><b>손잡이 제거가 유행을 끝냈다고 말할 수 있을까?</b></p><div id="qz"></div>`);
  quiz($("qz"), ["그렇다 — 손잡이를 떼자마자 끝났다","<b>단정하기 어렵다</b> — 이미 정점을 지나 줄고 있었다","아니다 — 공기가 맑아져서 끝났다"], 1, 200, stage7,
    "터프티의 지적 그대로입니다 — <b>\"스노의 업적에서 가장 유명한 부분이, 그의 증거 중 가장 불확실한 부분이기도 하다.\"</b> " +
    "그러니 손잡이는 이 이야기의 결말이 아닙니다. 진짜 결말은 그다음에 있습니다.",
    "사건 그 후 →");
}
function drawTimeline(full){
  const s=$("tsvg"), D=DATA.daily, cw=900, h=330, l=40, r=10, t=30, bt=40, max=140; s.setAttribute("viewBox",`0 0 ${cw} ${h}`); s.innerHTML="";
  const bw=(cw-l-r)/D.length, ys=v=>h-bt-v/max*(h-bt-t);
  [0,40,80,120].forEach(v=>{ el("line",{x1:l,x2:cw-r,y1:ys(v),y2:ys(v),stroke:"#efe9dd"},s); const tx=el("text",{x:l-6,y:ys(v)+4,"text-anchor":"end","font-size":11,fill:"#8b8378"},s); tx.textContent=v; });
  const iH=D.findIndex(d=>d.d==="09-08");
  D.forEach((d,k)=>{ const future = !full && k>=iH; const x=l+k*bw+1, w=bw-2, hh=future? (h-bt-ys(30)) : h-bt-ys(d.v);
    const rr=el("rect",{x,y:future?ys(30):ys(d.v),width:w,height:Math.max(0,hh),rx:2,class:"tbar"+(future?" future":"")+(full&&d.v===127?" peak":"")},s);
    if(future){ rr.setAttribute("height",0); }
    const [mm,dd]=d.d.split("-").map(Number);
    if(dd===1||dd%5===0||k===0){ const tx=el("text",{x:x+w/2,y:h-bt+15,"text-anchor":"middle","font-size":11,fill:"#8b8378"},s); tx.textContent=(dd===1||k===0)?`${mm}/${dd}`:dd; }
    if(!future && full){ rr.style.transition="height .6s, y .6s"; }
  });
  const xH=l+iH*bw+bw/2; el("line",{x1:xH,x2:xH,y1:t-12,y2:h-bt,stroke:"#191714","stroke-width":1.5,"stroke-dasharray":"4 3"},s);
  const a=el("text",{x:xH+6,y:t-2,"font-size":12.5,"font-weight":800,fill:"#191714"},s); a.textContent="9월 8일 손잡이 제거";
  if(!full){ const q=el("text",{x:xH+60,y:ys(60),"font-size":40,"font-weight":800,fill:"#cfc5b2"},s); q.textContent="?"; }
  else { const iP=D.findIndex(d=>d.v===127); const p=el("text",{x:l+iP*bw-4,y:ys(127)+12,"text-anchor":"end","font-size":12.5,"font-weight":800,fill:"#b3261e"},s); p.textContent="정점 9/2 · 127명"; }
}

// ════════════ STAGE 7 · 사건 그 후 ════════════
function stage7(){
  enterStage(7); $("tl").classList.add("hide"); animateTo(VFULL()); banner("");
  SPOTS.forEach(s=>{s.poly.classList.add("found"); s.lab.classList.add("found");});
  pumpEls[BROAD].g.classList.add("culprit"); pumpEls[BROAD].t.textContent=BROAD_LABEL;
  note(`<span class="tag">사건 그 후</span><h2>스노는 살아서 인정받지 못했다</h2>
    <p>솔직히 말하면, 이 지도는 <b>그때 사람들을 설득하지 못했다.</b></p>
    <ul class="after">
      <li><b>1855년</b> — 정부가 꾸린 조사위원회가 스노의 물 이야기를 <b>받아들이지 않았다.</b>
        여전히 "나쁜 공기 탓"이라고 결론 냈다.</li>
      <li><b>1858년</b> — 스노는 <b>45세에 죽었다.</b> 자기가 옳았다는 걸 끝내 못 보고.</li>
    </ul>
    <div class="case">눈에 보이지도 않는 뭔가가 물에 들어 있다는 말이, 그때로서는 너무 이상했던 것이다.</div>
    <button class="btn" id="n">그런데 그 뒤에… →</button>`);
  $("n").onclick = stage7b;
}
function stage7b(){
  note(`<span class="tag">사건 그 후</span><h2>그런데 결국 스노가 맞았다</h2>
    <ul class="after">
      <li><b>1858년 여름</b> — 템스강이 썩어 의회가 문을 닫을 지경이 되자, 런던은 마침내
        <b>하수도를 새로 깔기</b> 시작했다(1859년 착공). <b>똥물과 마실 물을 떼어 놓은 것이다.</b></li>
      <li><b>1866년</b> — 런던의 마지막 큰 콜레라 유행. 하필 <b>물을 제대로 거르지 않고 공급하던 회사</b>의
        구역에서만 터졌다. 스노의 말이 다시 한번 맞아떨어졌다.</li>
      <li><b>1884년</b> — 로베르트 코흐가 <b>콜레라균</b>을 현미경으로 찾아냈다.
        스노가 "물에 뭔가 있다"고 한 지 <b>30년 만</b>이었다.</li>
    </ul>
    <div class="case">오늘날 존 스노는 <b>역학의 아버지</b>로 불린다. "어디서, 누가, 무엇을 했길래 걸렸나"를
      자료로 따져 원인을 찾는 방식 — <b>코로나 때 우리가 매일 보던 그 방식</b>이 여기서 시작됐다.</div>
    <p class="q"><b>스노는 콜레라가 왜 생기는지 몰랐다.</b> 세균도 몰랐다. 그런데도 지도 한 장으로
      <b>어느 우물을 막아야 하는지를 정확히 짚었다.</b> 원인을 다 몰라도,
      <b>잘 그린 그림 한 장이면 결정을 내릴 수 있다.</b></p>
    <button class="btn" id="n">수사 결과 보기 🏅</button>`);
  $("n").onclick = ending;
}
function ending(){
  const pct = score/MAXSCORE;
  const [rank, color, msg] = pct>=.85 ? ["존 스노급 탐정","#b8860b","증거를 보고, 비교하고, 반례까지 챙겼다. 완벽한 수사!"]
    : pct>=.6 ? ["수석 역학 조사관","#7d8a96","핵심은 다 잡았다. 몇 번의 헛짚음은 좋은 공부."]
    : ["견습 탐정","#a0703a","사건은 풀었다! 다시 하면 더 빨리 찾을 수 있다."];
  confetti(110);
  note(`<div class="end"><span class="tag">사건 종결</span>
    <svg class="medal" viewBox="0 0 120 120"><path d="M38 6h18l8 34H46z" fill="#b3261e"/><path d="M82 6H64l-8 34h18z" fill="#2a5d8f"/>
      <circle cx="60" cy="74" r="38" fill="${color}"/><circle cx="60" cy="74" r="30" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/>
      <circle cx="56" cy="70" r="12" fill="none" stroke="#fff" stroke-width="5"/><path d="M65 79l11 11" stroke="#fff" stroke-width="6" stroke-linecap="round"/></svg>
    <div class="rank">${rank}</div><div class="bigscore">${score}<small style="font-size:18px;color:#8b8378"> / ${MAXSCORE}</small></div>
    <p style="margin-top:6px">${msg}</p></div>
    <div class="lesson"><b>이 지도가 좋은 데이터 시각화인 이유 — 세 가지</b><ol>
      <li><b>축을 바꿨다</b> — "며칠에 몇 명"을 세는 대신 <b>"어디서 죽었나"를 지도에 찍었다</b></li>
      <li><b>비교를 넣었다</b> — 죽은 사람 옆에 <b>안 죽은 사람</b>(구빈원·양조장·한산한 동네)을 같이 놓았다</li>
      <li><b>불리한 사례를 숨기지 않았다</b> — 자기 주장과 안 맞는 죽음을 <b>스스로 먼저 찾아</b> 설명했다</li></ol>
      <p style="margin-top:8px;font-weight:800">점 하나가 사람 한 명이었기에, 그 뭉침이 증거가 되었다.</p></div>
    <p class="q">인용할 때 — "터프티의 지도"가 아니라 <b>"존 스노의 콜레라 점 지도(1854),
      터프티 『시각적 설명』 31쪽 수록"</b>으로 쓴다.</p>
    <button class="btn" id="again">처음부터 다시 ↺</button>`);
  $("again").onclick = reset;
}
function reset(){
  score=0; $("score").textContent=0; doneCases=new Set(); found=new Set(); pick=false; finding=false;
  maxStage=0; snap.length=0;
  deathEls.forEach(o=>o.ln.classList.remove("on","new","noanim"));
  pumpEls.forEach(o=>{o.g.classList.remove("bad","culprit"); o.pulse.classList.remove("go");});
  SPOTS.forEach(s=>{s.poly.classList.remove("found"); s.lab.classList.remove("found");});
  gCases.innerHTML=""; gHint.innerHTML=""; gFx.innerHTML=""; gRings.classList.add("hide");
  svg.classList.remove("aim","pickable");
  $("datebox").classList.add("hide"); $("tl").classList.add("hide"); $("spark").innerHTML="";
  stage0();
}

drawStages(); applyVB(); stage0();
</script>
